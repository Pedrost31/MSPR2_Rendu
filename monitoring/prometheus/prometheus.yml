global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: healthai-coach

# Règles d'alerte
rule_files:
  - /etc/prometheus/alerts.yml

# Routage des alertes vers Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus lui-même
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Backend Express (prom-client)
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5000"]
        labels: { service: healthai-backend }

  # Microservices IA FastAPI (prometheus-fastapi-instrumentator)
  - job_name: ai-services
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8001"]
        labels: { service: food-recognition }
      - targets: ["host.docker.internal:8002"]
        labels: { service: recipe-suggestions }
      - targets: ["host.docker.internal:8003"]
        labels: { service: diet-plan }
      - targets: ["host.docker.internal:8004"]
        labels: { service: training-program }

  # Métriques des conteneurs (CPU, mémoire, réseau, I/O)
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
