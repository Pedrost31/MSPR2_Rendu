name: CD – Build & Push images

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    name: Build & push (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
            dockerfile: backend/Dockerfile
          - image: client
            context: client
            dockerfile: client/Dockerfile
          - image: ai-food-recognition
            context: ai_services
            dockerfile: ai_services/api1_food_recognition/Dockerfile
          - image: ai-recipe-suggestions
            context: ai_services
            dockerfile: ai_services/api2_recipe_suggestions/Dockerfile
          - image: ai-diet-plan
            context: ai_services
            dockerfile: ai_services/api3_diet_plan/Dockerfile
          - image: ai-training-program
            context: ai_services
            dockerfile: ai_services/api4_training_program/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Connexion au registre GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/healthai-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
