name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

# Annule les exécutions précédentes encore en cours sur la même branche/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend : lint TS, migrations Prisma, tests Jest + couverture ─────────────
  backend:
    name: Backend (tests + couverture)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healthai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/healthai_test
      MONGODB_URI: mongodb://127.0.0.1:27017/healthai_test
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Appliquer les migrations
        run: npx prisma migrate deploy

      - name: Compilation TypeScript (vérification de types)
        run: npx tsc --noEmit

      - name: Tests + couverture
        run: npm run test:coverage

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore

  # ── Microservices IA : tests Pytest (4 services en parallèle) ────────────────
  ai-services:
    name: Microservices IA (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api1_food_recognition
          - api2_recipe_suggestions
          - api3_diet_plan
          - api4_training_program
    defaults:
      run:
        working-directory: ai_services
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r ${{ matrix.service }}/requirements.txt

      - name: Tests Pytest – ${{ matrix.service }}
        working-directory: ai_services/${{ matrix.service }}
        run: python -m pytest -q

  # ── Frontend : lint ESLint + build Vite ──────────────────────────────────────
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Analyse statique (ESLint)
        run: npm run lint

      - name: Build de production
        run: npm run build

      - name: Publier le build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: client/dist
          if-no-files-found: ignore

  # ── Analyse de qualité de code (SonarCloud) – optionnel ──────────────────────
  # S'exécute uniquement si le secret SONAR_TOKEN est configuré.
  sonarcloud:
    name: Analyse SonarCloud
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Récupérer la couverture backend
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
        continue-on-error: true

      - name: Scan SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
